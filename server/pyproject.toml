[project]
name = "imv-server"
version = "0.9.20"
description = "IntelligentMixVideo Server End"
readme = "README.md"
authors = [
    { name = "HsiangNianian", email = "i@jyunko.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jieba==0.42.1",
    "jsonschema>=4.26.0",
    "openai>=3.13.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "protobuf>=7.36.2,<8",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "alibabacloud-ice20201109>=6.20.2",
    "alibabacloud-tea-openapi>=0.4.6",
    "darabonba-core>=1.0.9",
    "boto3>=1.40,<2",
    "referencing>=0.37.0",
    "opencv-python-headless==4.12.0.88",
    "fonttools>=4.60,<5",
]

# 服务器按需启用官方标点模型；普通客户端打包不携带 PyTorch。
[project.optional-dependencies]
ct-punc = ["funasr>=1.4.20", "torch>=2.15.0"]

[project.scripts]
server = "server.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["server", "generated"]
source-exclude = ["node_modules", ".cache", "__pycache__", ".data", ".log"]

# 在项目根目录运行 pytest 时，仅发现服务端测试；包由 uv 安装，不修改 sys.path。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.14,<4",
]

# funasr 导入时会尝试加载全部子模块并容忍缺依赖；CT-Punc 推理用不到的 funasr 直接依赖在此排除。
# 标记取 requires-python 下不可能成立的 python_version < '3'，uv 才会把它们移出跨平台锁文件
# （sys_platform == 'never' 仍会被记录）。保留 torch-complex 以免启动日志刷屏。
# 升级 funasr 后须用真实模型测试重新验证（见 segmentation/AGENTS.md）。
[tool.uv]
override-dependencies = [
    "huggingface-hub; python_version < '3'",
    "hydra-core; python_version < '3'",
    "jaconv; python_version < '3'",
    "jamo; python_version < '3'",
    "oss2; python_version < '3'",
    "rapidfuzz; python_version < '3'",
    "regex; python_version < '3'",
    "safetensors; python_version < '3'",
    "sentencepiece; python_version < '3'",
    "tensorboardx; python_version < '3'",
    "tiktoken; python_version < '3'",
    "transformers; python_version < '3'",
    "umap-learn; python_version < '3'",
    "websockets; python_version < '3'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
