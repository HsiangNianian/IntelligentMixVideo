syntax = "proto3";

package mix_video.v1;

import "google/protobuf/timestamp.proto";

// 创建或完整更新模板的请求。
// 更新时，模板 ID 通过接口路径传递。
// 字段必填、取值范围和组合规则由业务层校验。
message EffectTemplateCreate {
  // 模板名称，用于列表展示和查找。
  // 去除首尾空白后为 1～100 个字符，不能与其他模板重名。
  string name = 1;

  // 模板说明，用于描述风格或适用场景。
  // 可不填，默认空字符串，最多 1000 个字符。
  string description = 2;

  // 编辑配置，控制标题、字幕、气泡的样式、位置及动画。
  // 可不提供；缺失时按项目的旧版模板规则处理。
  EffectTemplateEditor editor = 3;

  // 所选特效的目录 ID 列表，必须包含分类前缀。
  // 例如 flower/CS0001-000001，而不是 CS0001-000001。
  // 必须包含 1～20 个不同 ID，顺序会保留。
  // 提供 editor 时，必须与其中选中的特效去重后的集合一致。
  repeated string effect_ids = 4;

  // 相邻镜头之间的转场时长，单位为秒。
  // 范围 0.1～3，未提供时由业务层使用默认值 0.5。
  // 选用转场效果时生效。
  optional double transition_duration_seconds = 5;
}

// 服务端返回的完整模板。
// 包含用户配置、服务端生成的标识、时间及特效参数快照。
message EffectTemplate {
  // 保存后的模板名称，用于展示和查找。
  string name = 1;

  // 保存后的模板说明；未填写时为空字符串。
  string description = 2;

  // 保存后的编辑配置；旧版模板可能没有该字段。
  EffectTemplateEditor editor = 3;

  // 保存的特效目录 ID 列表，包含分类前缀并保留选择顺序。
  repeated string effect_ids = 4;

  // 保存的镜头转场时长，单位为秒，范围 0.1～3。
  optional double transition_duration_seconds = 5;

  // 模板唯一标识，使用 UUID 字符串。
  // 由服务端生成，用于查询、更新、删除和项目绑定。
  string template_id = 6;

  // 保存模板时，由服务端根据 effect_ids 解析出的特效快照。
  // 包含实际渲染参数，目录后续变化不会自动修改该快照。
  repeated EffectAsset effects = 7;

  // 模板创建时间，由服务端生成，表示 UTC 时间点。
  google.protobuf.Timestamp created_at = 8;

  // 模板最后一次更新时间，由服务端在保存时更新。
  google.protobuf.Timestamp updated_at = 9;
}

// 模板编辑配置。
// 示例文字用于模板预览，正式成片文字由剪辑计划提供。
// optional 字段未提供时，业务层应补齐默认值。
// 以下特效选择字段均填写带分类前缀的目录 ID，空字符串表示不使用。
message EffectTemplateEditor {
  // 标题示例文字，最多 60 个字符。
  // 默认：“让每一帧 都有风格”。
  optional string title = 1;

  // 字幕示例文字，最多 100 个字符。
  // 默认：“选择花字、滤镜和特效，看看组合效果”。
  optional string subtitle = 2;

  // 气泡示例文字，最多 40 个字符。
  // 默认：“超值特惠”。
  optional string bubble_text = 3;

  // 标题字号，范围 12～120，默认 40。
  optional int32 title_size = 4;

  // 字幕字号，范围 12～120，默认 26。
  optional int32 subtitle_size = 5;

  // 气泡文字字号，范围 12～120，默认 32。
  optional int32 bubble_size = 6;

  // 标题横向位置，使用 0～100 的百分比坐标，默认 50。
  optional double title_x = 7;

  // 标题纵向位置，使用 0～100 的百分比坐标，默认 8。
  optional double title_y = 8;

  // 字幕横向位置，使用 0～100 的百分比坐标，默认 50。
  optional double subtitle_x = 9;

  // 字幕纵向位置，使用 0～100 的百分比坐标，默认 82。
  optional double subtitle_y = 10;

  // 气泡横向位置，使用 0～100 的百分比坐标，默认 25。
  optional double bubble_x = 11;

  // 气泡纵向位置，使用 0～100 的百分比坐标，默认 32。
  optional double bubble_y = 12;

  // 标题花字样式，控制文字的艺术外观。
  // 必须属于 flower 分类，例如 flower/CS0001-000001。
  string title_flower = 13;

  // 字幕花字样式，控制字幕的艺术外观。
  // 必须属于 flower 分类，可与标题使用不同样式。
  string subtitle_flower = 14;

  // 气泡样式，控制气泡文字使用的装饰外观。
  // 必须属于 bubble 分类，例如 bubble/BS0001-000001。
  string bubble = 15;

  // 画面滤镜，供剪辑计划选用，调整镜头色彩或整体观感。
  // 必须属于 filter 分类，例如 filter/pf3。
  string filter = 16;

  // 普通画面特效，供剪辑计划选用并应用于镜头。
  // 必须属于 vfx/normal 分类。
  string vfx = 17;

  // 普通镜头转场效果，供剪辑计划用于相邻镜头之间。
  // 必须属于 transition/normal 分类；
  // 时长由模板的 transition_duration_seconds 控制。
  string transition = 18;

  // 标题入场动画，控制标题出现时的动作。
  // 必须属于 in 分类，例如 in/fade_in。
  // 可以与 title_out 同时使用，不能与 title_loop 同时使用。
  string title_in = 19;

  // 标题出场动画，控制标题消失时的动作。
  // 必须属于 out 分类，例如 out/fade_out。
  // 可以与 title_in 同时使用，不能与 title_loop 同时使用。
  string title_out = 20;

  // 标题循环动画，在标题显示期间重复播放。
  // 必须属于 loop 分类；不能与 title_in、title_out 同时使用。
  string title_loop = 21;

  // 字幕入场动画，控制字幕出现时的动作。
  // 必须属于 in 分类；不能与 subtitle_loop 同时使用。
  string subtitle_in = 22;

  // 字幕出场动画，控制字幕消失时的动作。
  // 必须属于 out 分类；不能与 subtitle_loop 同时使用。
  string subtitle_out = 23;

  // 字幕循环动画，在字幕显示期间重复播放。
  // 必须属于 loop 分类；
  // 不能与 subtitle_in、subtitle_out 同时使用。
  string subtitle_loop = 24;

  // 气泡入场动画，控制气泡文字出现时的动作。
  // 必须属于 in 分类；不能与 bubble_loop 同时使用。
  string bubble_in = 25;

  // 气泡出场动画，控制气泡文字消失时的动作。
  // 必须属于 out 分类；不能与 bubble_loop 同时使用。
  string bubble_out = 26;

  // 气泡循环动画，在气泡文字显示期间重复播放。
  // 必须属于 loop 分类；
  // 不能与 bubble_in、bubble_out 同时使用。
  string bubble_loop = 27;

  // 标题入场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 title_in 时生效。
  optional double title_in_duration = 28;

  // 标题出场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 title_out 时生效。
  optional double title_out_duration = 29;

  // 字幕入场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 subtitle_in 时生效。
  optional double subtitle_in_duration = 30;

  // 字幕出场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 subtitle_out 时生效。
  optional double subtitle_out_duration = 31;

  // 气泡入场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 bubble_in 时生效。
  optional double bubble_in_duration = 32;

  // 气泡出场动画时长，单位为秒。
  // 范围 0.1～3，默认 0.5；配置 bubble_out 时生效。
  optional double bubble_out_duration = 33;
}

// 单个特效的目录信息及参数快照。
// 创建、更新模板时由服务端解析，不接受客户端直接提交参数。
message EffectAsset {
  // 特效目录唯一 ID，由分类和官方特效标识组成。
  // 例如 flower/CS0001-000001；
  // 用于模板选择、目录查找和预览接口。
  string id = 1;

  // 特效分类，用于判断效果用途和校验组合。
  // 允许：flower、in、out、loop、bubble、
  // filter、vfx/normal、transition/normal。
  string category = 2;

  // 特效展示名称，用于选择列表和模板详情展示。
  string name = 3;

  // IMS 官方特效标识，不包含分类前缀。
  // 例如 CS0001-000001；用于构造供应商渲染参数。
  string effect_id = 4;

  // 渲染参数键值对，由服务端从受信任目录解析。
  // 例如花字：{"EffectColorStyle": "CS0001-000001"}。
  // 不同分类对应不同参数键。
  map<string, string> parameters = 5;

  // 目录提供的特效预览 URL，用于展示单个效果。
  // 可能为空；不是模板合成视频的地址。
  string preview_url = 6;

  // 预览图片相对于特效素材根目录的路径。
  // 由服务端定位本地预览资源使用；可能不存在。
  optional string preview_path = 7;
}

// 模板列表查询结果。
message EffectTemplateList {
  // 查询返回的完整模板集合；没有模板时为空列表。
  // 当前业务按更新时间倒序返回。
  repeated EffectTemplate templates = 1;
}
