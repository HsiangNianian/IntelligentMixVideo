// Remotion Sprite 的发布、目录和合成输入协议。
// Sprite 保存已经验收的外观与动画；代码只是确定的样例，文字、颜色、位置等由发布时抽出的参数调整，
// 模板里每次摆放的参数覆盖保存在 remotion 轨道的 editor.remotion 中。
// Sprite 在云端模板里的使用不在本包：它是 imv.template.v1.EffectTrack 的一条 remotion 轨道，
// 以 sprite_id 引用这里发布的 Sprite，同一个 Sprite 可以在同一模板里摆放多次。
syntax = "proto3";

package imv.sprite.v1;

import "google/protobuf/timestamp.proto";

// 发布版本的内容类型；发布后不能把同一个 Sprite 改成另一种类型。
// 界面分为三类：TEXT 为「字效」，FILTER_OVERLAY 为「滤镜」，VIDEO_OVERLAY 与 TRANSITION_OVERLAY 合为「转场与视频特效」。
// 所有类型都是透明叠加层，不读取也不修改底片像素；类型决定发布时必备的参数和宿主可调的变换。
enum SpriteKind {
  // 未指定；不能作为可发布的类型。
  SPRITE_KIND_UNSPECIFIED = 0;
  // 字效：透明背景文字层，必备 text、fontSize、fontWeight、color；宿主可调位置、缩放、旋转和不透明度。
  SPRITE_KIND_TEXT = 1;
  // 滤镜：调色蒙层、颗粒、暗角等整画面叠加层，必备 intensity、tintColor；宿主只调不透明度。
  SPRITE_KIND_FILTER_OVERLAY = 2;
  // 视频特效：覆盖在底片上的动效，必备 color、speed；宿主可调位置、缩放、旋转和不透明度。
  SPRITE_KIND_VIDEO_OVERLAY = 3;
  // 转场：按秒摆放在切点附近的闪白、漏光、色块擦除等叠加层，必备 color、speed；宿主只调不透明度。
  SPRITE_KIND_TRANSITION_OVERLAY = 4;
}

// 参数在运营界面的展示与编辑权限；运营不能用参数覆盖源码或真实时间。
enum OperatorAccess {
  // 未声明权限；不应作为可编辑控件使用。
  OPERATOR_ACCESS_UNSPECIFIED = 0;
  // 运营可见发布值，但不能在模板编辑里修改。
  OPERATOR_ACCESS_VISIBLE_READ_ONLY = 1;
  // 运营可见且可修改；覆盖值保存在模板 remotion 轨道的 editor.remotion.parameters 中。
  // 发布时没有渲染参数边界样本的早期发布（没有 content_box）在目录中改为只读。
  OPERATOR_ACCESS_VISIBLE_EDITABLE = 2;
  // 发布版本内部使用；模板编辑不展示，也不接受覆盖。
  OPERATOR_ACCESS_INTERNAL = 3;
}

// 字符串列表值，目前只用于字效的 keywords 参数。
message StringList {
  // 按声明顺序保存的字符串；空列表是有效值。
  repeated string values = 1;
}

// 单个参数值。oneof 保留字符串、数字、布尔值或字符串列表的类型，
// 覆盖值必须与发布默认值同型，并满足发布时保存的参数约束。
message ScalarValue {
  oneof value {
    // 字符串值；可再受 SpriteParameter.min_length/max_length 约束。
    string string_value = 1;
    // 有限数字；可再受 SpriteParameter.minimum/maximum 约束。
    double number_value = 2;
    // 开关类样式值；false 是有效值，不表示字段缺失。
    bool bool_value = 3;
    // 字符串列表；可再受 SpriteParameter.max_items 与 max_length（逐项）约束。
    StringList string_list_value = 4;
  }
}

// 参数的展示格式；未指定时按值的类型选择控件。
enum SpriteParameterFormat {
  // 未指定格式。
  SPRITE_PARAMETER_FORMAT_UNSPECIFIED = 0;
  // 颜色字符串，格式为 #RRGGBB 或 #RRGGBBAA。
  SPRITE_PARAMETER_FORMAT_COLOR = 1;
  // 整数：number_value 只取整数值，覆盖值不能带小数。
  SPRITE_PARAMETER_FORMAT_INTEGER = 2;
}

// 已发布版本允许运营查看或修改的一个参数控件。
// key 对应验收代码中的配置字段；字段不能表示绝对时间。
message SpriteParameter {
  // 配置字段名，覆盖值通过同名 key 找到该参数。
  // 新发布只暴露配置顶层的参数；历史发布可能使用以点分隔的嵌套路径。
  string key = 1;
  // 模板编辑界面显示的控件名称。
  string label = 2;
  // 控件可见性和可编辑性；只有 VISIBLE_EDITABLE 接受覆盖。
  OperatorAccess access = 3;
  // 发布时验收过的默认值，也决定后续覆盖值的数据类型。
  ScalarValue default_value = 4;
  // 可选数字下界；缺失与显式设置为零不同。
  optional double minimum = 5;
  // 可选数字上界；缺失表示不通过此字段设置上界。
  optional double maximum = 6;
  // 可选离散取值；非空时运营覆盖值必须与某一项同型且相等。
  // 例如字重只允许 400/700、对齐只允许 left/center/right；空数组表示不限制枚举。
  repeated ScalarValue allowed_values = 7;
  // 展示格式，例如颜色。
  SpriteParameterFormat format = 8;
  // 可选字符串长度下界，按 Unicode 码点计数；对字符串列表逐项生效。
  optional uint32 min_length = 9;
  // 可选字符串长度上界，按 Unicode 码点计数；对字符串列表逐项生效。
  optional uint32 max_length = 10;
  // 可选字符串列表的最大项数。
  optional uint32 max_items = 11;
  // 自由组件样式参数的面板分组（Schema 的 x-imv-group，例如「入场·上浮」）；空串表示不分组。
  // 模板编辑把同组参数放进一张卡片，并允许按摆放调整。
  string group = 12;
}

// 画布上的矩形区域，单位为画布像素，原点在左上角。
message SpriteBox {
  // 左边缘横坐标。
  double x = 1;
  // 上边缘纵坐标。
  double y = 2;
  // 宽度，大于零。
  double width = 3;
  // 高度，大于零。
  double height = 4;
}

// Sprite 发布时固定的画布和帧率，也是 SpriteRenderInput 帧数的计量基准。
// IMS 成片可以使用不同画幅；透明视频交给 IMS 后再通过 Cover 缩放或裁切。
message SpriteCanvas {
  // 发布画布宽度，单位像素。
  uint32 width = 1;
  // 发布画布高度，单位像素。
  uint32 height = 2;
  // 发布帧率，单位帧/秒；新发布的 Remotion Sprite 固定为 30 FPS。
  // 渲染请求中的效果内帧数按此值计算；历史发布仍保留原帧率。
  uint32 fps = 3;
  // Agent 验收时的示例预览帧数；不限制总线实际业务区间的长度。
  uint32 preview_frames = 4;
}

// 一次发布。服务端复制已通过验收的代码、参数契约和预览，代码与参数此后不变，
// 因而源聊天被删除或继续编辑后，模板里引用的 Sprite 仍指向同一发布内容；
// 未被模板使用的发布可以整体删除。
// 此消息包含私有源码和配置，不通过公开目录或模板编辑接口完整返回。
message PublishedSprite {
  // 发布记录的 UUID；模板里的 remotion 轨道和渲染均引用此 ID，而不是聊天版本 ID。
  string sprite_id = 1;
  // 生成该发布内容且已通过完整验收的 Remotion Agent 版本 UUID。
  string source_version_id = 2;
  // 运营看到的发布名称。
  string name = 3;
  // 发布时固定的内容类型。
  SpriteKind kind = 4;
  // 发布画布；实际渲染必须使用相同宽、高和 FPS。
  SpriteCanvas canvas = 5;
  // 已验收的 TSX 实现，仅服务端渲染使用，不进入公开目录响应。
  string tsx_code = 6;
  // TSX 字节内容的 SHA-256，用于读取发布记录时核验完整性。
  string code_sha256 = 7;
  // 运营可见或内部使用的已验收参数声明；新发布的字效包含可编辑的文字参数。
  repeated SpriteParameter parameters = 8;
  // 字效保存文字内容的配置字段名，新发布固定为 text；视觉 Sprite 留空。
  string text_prop = 9;
  // 字效保存高亮关键词列表的配置字段名，新发布声明了关键词时为 keywords，否则留空。
  // 组件自行在文字内查找各关键词的字面命中并高亮。
  string keywords_prop = 10;
  // 不可变发布记录创建的时间。
  google.protobuf.Timestamp published_at = 11;
  // 资产自有的交互预览播放器包对象（imv/remotion/sprites/<id>/interactive.js）的 SHA-256，
  // 每次读取预览前核验，副本丢失或不符时按发布源码重建并更新；该预览不是合成用透明素材。
  string preview_sha256 = 12;
  // 发布时验收的 JSON Schema，仅服务端用于校验最终渲染配置。
  string config_schema_json = 13;
  // 发布时验收的完整默认配置；渲染时先读取它，再应用合法样式覆盖与业务文字。
  string default_config_json = 14;
  // 字幕入场与出场动画的合计帧数；业务字幕更短时用于决定是否直接显示静态画面。
  uint32 animation_frames = 15;
  // 发布验收帧中选出的可见帧号；短字幕冻结此帧，避免动画吞掉正文。
  uint32 static_frame = 16;
  // 预留的气泡素材地址；本期不制作气泡字，保持空值。
  string bubble_asset_url = 17;
  // 预留气泡素材宽度；本期保持零。
  uint32 bubble_asset_width = 18;
  // 预留气泡素材高度；本期保持零。
  uint32 bubble_asset_height = 19;
  // 内容区域：发布时各实例布局的并集与画布求交；宿主的位置、缩放和旋转以其中心为原点。
  // 历史发布未记录时视为整块画布。
  SpriteBox content_box = 20;
}

// 公开目录使用的发布摘要；只包含运营选择与预览需要的信息，不返回 TSX 源码。
message SpriteSummary {
  // 不可变发布的 UUID，Remotion 片段通过此 ID 引用。
  string sprite_id = 1;
  // 目录和模板里已添加的片段显示的名称。
  string name = 2;
  // 用于筛选可选择的作用对象。
  SpriteKind kind = 3;
  // 供编辑器预览布局及总线确定渲染画布。
  SpriteCanvas canvas = 4;
  // 样式参数声明；界面按 access 决定展示与编辑，只有可编辑项能写入覆盖。
  repeated SpriteParameter parameters = 5;
  // 对应的 Agent 成功版本 ID，仅供追溯来源。
  string source_version_id = 6;
  // 交互预览页的读取路径（/api/sprites/{sprite_id}/preview）：在隔离沙箱中运行发布时复制的播放器包，
  // 追加 overlay=true 得到透明背景版本；仅用于编辑预览，不作为 IMS 合成素材。
  string preview_url = 7;
  // 是否已验收关键词高亮能力；合成总线绑定字幕时参考此值。
  bool keywords_supported = 8;
  // 内容区域，与 PublishedSprite.content_box 相同；模板编辑器据此计算默认位置和拖动范围。
  SpriteBox content_box = 9;
  // 字效的固定行数：多行字效（声明 lineStartFrames 参数）为 2～4，文字用换行分隔各行，
  // 字幕的连续切片逐行填入；单行字效为 1，其他分类为 0。
  uint32 line_count = 10;
}

// GET /api/sprites 的响应，返回可供运营选择的不可变发布条目。
message ListSpritesResponse {
  // 当前可供运营添加的 Sprite 目录。
  repeated SpriteSummary sprites = 1;
}

// POST /api/sprites/publish 的请求；源版本必须已完整通过验收。
message PublishSpriteRequest {
  // 要发布的 Agent 成功版本 UUID。
  string source_version_id = 1;
  // 发布类型，默认取 Agent 判断的分类，用户可以改选；服务端按此类型检查必备参数。
  // 覆盖保存时必须与目标资产的类型一致。
  SpriteKind kind = 2;
  // 字效的文字配置字段，新版本必须为 text；视觉 Sprite 留空。
  string text_prop = 3;
  // 字效的关键词配置字段，新版本声明了关键词时为 keywords，否则留空。
  // 覆盖保存时不能去掉目标资产已有的关键词字段。
  string keywords_prop = 4;
  // 覆盖保存的目标资产 UUID；为空时保存为新资产。提供时用本版本内容替换该资产并沿用它的
  // sprite_id 与名称，模板里引用它的片段随即可用新版本；画布、类型与文字/关键词字段须与目标一致。
  string target_sprite_id = 5;
  // 选填资产名称，去除首尾空白后最多 100 字符；留空时新资产用 AI 生成的名称，覆盖或重复保存保留现名。
  string name = 6;
}

// 发布结果只返回可公开的摘要；相同源版本和参数重复发布返回原 Sprite。
message PublishSpriteResponse {
  SpriteSummary sprite = 1;
}

// POST /api/sprites/{sprite_id}/rename 的请求；只改目录里显示的名称，代码、参数与预览不变。
message RenameSpriteRequest {
  // 新名称，去除首尾空白后为 1～100 个字符；不要求唯一。
  string name = 1;
}

// 重命名后的目录条目。
message RenameSpriteResponse {
  SpriteSummary sprite = 1;
}

// 一个运营参数覆盖；key 必须对应已发布 Sprite 的 VISIBLE_EDITABLE 参数。
message SpriteParameterOverride {
  // 参数配置字段名，同一渲染请求中不能重复。
  string key = 1;
  // 与 SpriteParameter.default_value 同型，并满足发布时的 JSON Schema 与数字边界。
  ScalarValue value = 2;
}

// POST /api/sprites/render 的一次渲染输入（application/x-protobuf），由总线在切片、素材匹配与时间对齐后生成。
// Sprite 是固定的 style 加 content：style 是已验收的代码与样式参数（resolved_style、transform），
// content 是文字与关键词——标题这样整段一条文字用 text 与 keywords，字幕用按时间排列的 cues；
// time 是 effect_total_frames；Agent 生成时选的时长只用于预览。
// 一个请求得到整个效果的一个完整视频（0.5～120 秒）：服务端按 30 秒一块依次渲染再无损拼接，
// 每块里 Sprite 都读到完整时长，动画跨块连续，总线不需要分段。效果内的帧数都按发布画布的 fps 计数，
// 与最终 IMS 成片的时间轴位置无关。服务端受理后异步渲染透明 VP9 Alpha WebM，转存为可公开读取的对象后回调；
// 总线把它放入 IMS VideoTrack。
message SpriteRenderInput {
  // 早期设计里由总线分段的偏移与帧数；现在由服务端切块，字段号保留不再使用。
  reserved 4, 5;
  reserved "effect_offset_frames", "render_frame_count";
  // 需要渲染的不可变发布 ID；服务端据此读取已验收源码与默认配置。
  string sprite_id = 1;
  // 触发本次渲染的摆放实例 ID（模板里 remotion 轨道的 id），供总线关联和诊断；渲染器不会据此重新读取模板。
  string placement_id = 2;
  // 可省略；提供时 width、height、fps 必须与发布画布一致，preview_frames 不决定本次渲染时长。
  // IMS 可在加入时间线后通过 Cover 把输出缩放到最终成片画布。
  SpriteCanvas output = 3;
  // content：整段只有一条文字时使用，例如标题取请求 title，Sprite 在整个效果时长内显示它。
  // 字效必须给出 text 或 cues 之一，视觉 Sprite 两者都留空；必须满足字效文字参数发布时的长度限制，否则拒绝受理。
  string text = 6;
  // content：与 text 一起使用的关键词；组件在 text 内查找各词的字面命中并高亮。
  // 不支持关键词的 Sprite 不接收非空数组；数量与每词长度受发布时的关键词参数限制。
  repeated string keywords = 7;
  // style：总线取出的可编辑样式覆盖（模板 remotion 轨道 editor.remotion.parameters）；
  // 不允许在此覆盖文字、关键词、只读字段或源码。未列出的字段沿用发布默认值，渲染服务按发布参数契约校验。
  repeated SpriteParameterOverride resolved_style = 8;
  // time：完整效果的总帧数，0.5～120 秒，也是输出视频的帧数；不带字幕切片时 Sprite 按这个长度排布与播放。
  // 由秒数半帧向后取整得到（floor(秒 × fps + 0.5)），与叠加渲染一致。
  uint64 effect_total_frames = 9;
  // 终态通知地址（HTTP/HTTPS）；可省略，总线也可以查询任务。回调体与叠加渲染相同：
  // taskId、status（succeed 或 failed）、videoUrl、errorMessage。
  string callback_url = 10;
  // style：摆放的宿主变换（模板 remotion 轨道 editor.remotion.transform），未设置的字段取默认值；
  // 只能设置该分类允许的字段，范围与模板保存时相同。
  SpriteHostTransform transform = 11;
  // content：字幕的切片，按起点排列、互不重叠，都在效果时长之内；与 text 二选一。
  // 每个切片用同一个 Sprite 在自己的区间里显示一次，Sprite 读到的 durationInFrames 是切片的帧数，
  // 切片之间与之外的帧保持透明。显示不足 1.5 秒的字效（短字幕或短标题）不播出入场：按发布的预览长度
  // 定格在其中间帧，只显示自己的帧数，避免闪烁。多行字效（line_count 大于 1）把同一句里最多
  // line_count 个连续切片合成一组：第 i 行在第 i 个切片开始时出现，整组在最后一个切片结束时清空；
  // 定格按整组的长度判断，定格时所有行同时显示。
  repeated SpriteCue cues = 12;
}

// 一条字幕切片：文字、关键词与它在效果时间轴上的区间。帧号按发布画布的 fps 计数，
// 由切片秒数半帧向后取整得到（floor(秒 × fps + 0.5)），与叠加渲染一致。
message SpriteCue {
  // 切片正文（总线清理后的短句，通常不超过 8 个字），必须满足字效文字参数的长度限制。
  string text = 1;
  // 切片关键词；不支持关键词的 Sprite 不接收非空数组。
  repeated string keywords = 2;
  // 切片开始帧（含），从效果起点算起。
  uint64 start_frame = 3;
  // 切片结束帧（不含），必须晚于开始帧。
  uint64 end_frame = 4;
  // 切片所属的句子序号（同一句的切片相同，0 表示未给出）。多行字效把同一句里最多 line_count 个
  // 连续切片逐行显示在同一个画面里，换句时即使没有填满也先清空；未给出时只按行数分组。
  uint32 sentence = 5;
}

// 宿主变换：内容区域中心在画布上的位置（像素）、缩放、旋转（度）与不透明度。
message SpriteHostTransform {
  // 内容中心横坐标，0～画布宽。
  optional double x = 1;
  // 内容中心纵坐标，0～画布高。
  optional double y = 2;
  // 缩放，0.25～4。
  optional double scale = 3;
  // 旋转角度，-180～180。
  optional double rotation = 4;
  // 不透明度，0～1。
  optional double opacity = 5;
}

// POST /api/sprites/render 的受理结果。
message SpriteRenderAccepted {
  // 渲染任务 ID，用于 GET /api/sprites/render/{task_id} 与回调关联。
  string task_id = 1;
}

// GET /api/sprites/render/{task_id} 的任务状态；失败仍为 200 并携带脱敏错误。
message SpriteRenderTask {
  // 渲染任务 ID。
  string task_id = 1;
  // queued、rendering、uploading、succeeded 或 failed。
  string status = 2;
  // 成功后的可公开读取 WebM 地址；其他状态为空。
  string video_url = 3;
  // 失败时的稳定错误码；其他状态为空。
  string error_code = 4;
  // 失败时的固定说明，不含本机路径或渲染器输出；其他状态为空。
  string error_message = 5;
}
