name: Build client

on:
  push:
    branches: ["**"]
    paths: ["client/**", ".github/workflows/client-build.yml", ".github/scripts/**"]
  pull_request:
    paths: ["client/**", ".github/workflows/client-build.yml", ".github/scripts/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag used to set the client version in this build only"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 libxdo-dev patchelf
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('client/bun.lock', 'client/package.json') }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Set release version from tag
        if: inputs.release-tag != ''
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          bun .github/scripts/validate-release.mjs --write
          bun .github/scripts/validate-release.mjs
      - name: Install frontend dependencies
        # Also checks that tag version injection preserves the dependency lock.
        run: bun install --frozen-lockfile
      - name: Verify Cargo lockfile
        if: inputs.release-tag != ''
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 > cargo-metadata.json
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build desktop installers
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-mix-video-${{ matrix.name }}-${{ github.sha }}
          path: |
            client/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            client/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            client/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
