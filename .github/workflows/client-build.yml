# 复用平台矩阵：审查时只检查原生编译，集成/发版/手动运行时生成安装包。
name: Build client

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build-mode:
        description: "check validates native code; package produces all installers"
        required: false
        type: string
        default: package
      release-tag:
        description: "Release tag that must match committed client and server versions"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: client-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.build-mode == 'check' && 'Check' || 'Build' }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate build mode
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build-mode || 'package' }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          case "$BUILD_MODE" in check|package) ;; *) exit 1 ;; esac
          if [ -n "$RELEASE_TAG" ] && [ "$BUILD_MODE" != package ]; then exit 1; fi
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 libxdo-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-tools
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('client/bun.lock', 'client/package.json') }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          key: ${{ matrix.target }}
          shared-key: ${{ inputs.build-mode || 'package' }}
      - name: Verify committed project versions
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: bun .github/scripts/validate-release.mjs
      - name: Install frontend dependencies
        # Version preparation must preserve the dependency lock.
        run: bun install --frozen-lockfile
      - name: Verify Cargo lockfile
        if: inputs.release-tag != ''
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 > cargo-metadata.json
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build desktop installers
        if: inputs.build-mode != 'check'
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test AppImage media plugins
        if: runner.os == 'Linux' && inputs.build-mode != 'check'
        run: bash ../.github/scripts/appimage-media-smoke.sh src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
      - name: Check native targets
        if: inputs.build-mode == 'check'
        run: |
          bun run build
          cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets --locked
      - name: Test Windows resource server
        if: runner.os == 'Windows' && inputs.build-mode == 'check'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib --locked
      - name: Upload installers
        if: inputs.build-mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-mix-video-${{ matrix.name }}-${{ github.sha }}
          path: |
            client/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            client/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            client/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
