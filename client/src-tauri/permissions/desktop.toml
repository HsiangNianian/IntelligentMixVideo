# 桌面页面可访问模板、设置、本地预览视频、字效会话存储和内置服务启动命令；Windows 的 URL 在绑定端口后精确授权。
[[permission]]
identifier = "desktop-commands"
description = "Use local templates, settings, local preview videos, Remotion sessions and start the bundled debug backend"
commands.allow = ["local_templates", "local_settings", "preview_video_list", "preview_video_read", "preview_video_write", "preview_video_remove", "remotion_sessions", "start_backend"]
