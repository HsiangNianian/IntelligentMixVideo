[package]
name = "client"
version = "0.9.6"
description = "IntelligentMixVideo desktop client"
edition = "2021"
# 更新插件要求 Rust 1.90；文件锁使用标准库。
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["update-tools"]

[build-dependencies]
imv-update-build = { path = "update-tools" }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
base64 = "0.22"
minisign-verify = "0.3"
sha2 = "0.10"
semver = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
prost = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
# 大文件落盘经 block_in_place 让出 Tauri 的异步工作线程；与 tauri 共用同一运行时。
tokio = { version = "1", features = ["rt-multi-thread"] }
# 字效会话本地库；bundled 随包编译 SQLite，不依赖系统库。
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
tiny_http = "0.12"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
