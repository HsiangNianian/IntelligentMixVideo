<!doctype html>
<!-- HTML 入口提供 React 挂载节点，再由 main.tsx 加载页面与全局样式。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelligentMixVideo</title>
    <!-- 首帧前恢复主题，优先沿用用户选择；首次打开或存储不可用时跟随系统。 -->
    <script>
      let theme;
      try { theme = localStorage.getItem("imv.theme"); } catch {}
      const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
