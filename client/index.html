<!doctype html>
<!-- HTML 入口提供 React 挂载节点，再由 main.tsx 加载页面与全局样式。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelligentMixVideo</title>
    <!-- 首帧前恢复主题，避免闪烁：优先使用 ThemeToggle 保存的选择，否则跟随系统。 -->
    <script>
      try {
        const saved = localStorage.getItem("imv.theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
